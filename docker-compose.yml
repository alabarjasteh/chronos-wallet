services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronos_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chronos_wallet"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/chronos_wallet?sslmode=disable"
    ports:
      - "8080:8080"
